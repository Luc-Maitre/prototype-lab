<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fdf9f0">
  <title>Labo — Transitions entre écrans</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/lab.css">
  <link rel="stylesheet" href="css/shapes.css">
  <link rel="stylesheet" href="css/wrapup-transitions.css">
</head>
<body class="shapes wtr">
  <nav class="lab-bar" id="bar" aria-label="Contrôles"></nav>

  <!-- Le fond de formes physiques est ici, commun à tous les écrans ; les écrans (pages du labo en ?bare&sansfond) glissent par-dessus -->
  <div class="app" id="app">
    <div class="layer" id="bg" aria-hidden="true"><div class="veil"></div></div>
    <iframe class="wtr-view" id="view-a" title="Écran" tabindex="-1"></iframe>
    <iframe class="wtr-view" id="view-b" title="Écran" tabindex="-1" hidden></iframe>
  </div>

  <script src="js/shapes.js"></script>
  <script src="js/physics.js"></script>
  <script src="js/wrapup-transitions.js"></script>
</body>
</html>
