<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ec5a13">
  <title>Labo — Médaille holographique</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/lab.css">
  <link rel="stylesheet" href="css/reveal.css">
</head>
<body class="reveal">
  <nav class="lab-bar" id="bar" aria-label="Contrôles"></nav>

  <div class="app" id="app">
    <div class="layer stage" id="stage">
      <main class="screens">
        <section class="screen is-active" aria-label="Médaille">
          <p class="unit">Votre médaille</p>
          <div class="medal" id="medal">
            <img class="medal-base" src="assets/medal-sceau.svg" alt="">
            <div class="medal-foil"><canvas id="foil" width="617" height="559"></canvas></div>
            <p class="medal-title">Holo</p>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="js/holo.js"></script>
  <script src="js/reveal.js"></script>
</body>
</html>
