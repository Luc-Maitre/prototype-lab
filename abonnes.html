<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fdf9f0">
  <title>Labo — Abonnés</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/lab.css">
  <link rel="stylesheet" href="css/data.css">
  <link rel="stylesheet" href="css/shapes.css">
  <link rel="stylesheet" href="css/abonnes.css">
</head>
<body class="data shapes abonnes">
  <nav class="lab-bar" id="bar" aria-label="Contrôles"></nav>

  <div class="app" id="app">
    <div class="layer" id="bg" aria-hidden="true"><div class="veil"></div></div>
    <div class="layer">
      <main class="screens">
        <section class="screen is-active" id="screen" aria-label="Abonnés">
          <div class="ab-content">
            <div class="data-simple" id="data">
              <p class="ds-top" id="ds-top"></p>
              <p class="ds-value" id="ds-value"></p>
              <p class="ds-bottom" id="ds-bottom"></p>
            </div>
            <div class="followers" id="followers" aria-hidden="true"></div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script>window.WRAPUP = {};</script>
  <script src="js/shapes.js"></script>
  <script src="js/physics.js"></script>
  <script src="js/data.js"></script>
  <script src="js/abonnes.js"></script>
</body>
</html>
