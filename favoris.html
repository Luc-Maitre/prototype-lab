<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fdf9f0">
  <title>Labo — Favoris</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/lab.css">
  <link rel="stylesheet" href="css/data.css">
  <link rel="stylesheet" href="css/shapes.css">
  <link rel="stylesheet" href="css/favoris.css">
</head>
<body class="data shapes">
  <nav class="lab-bar" id="bar" aria-label="Contrôles"></nav>

  <div class="app" id="app">
    <div class="layer" id="bg" aria-hidden="true"><div class="veil"></div></div>
    <div class="layer">
      <main class="screens">
        <section class="screen fav is-active" id="screen" aria-label="Favoris">
          <p class="fav-top fx ds-top" id="fav-top"></p>
          <p class="fav-value fx ds-value" id="fav-value" data-count-to="23" data-count-sync=".fav-grid .heart"></p>
          <p class="fav-unit fx ds-bottom" id="fav-unit"></p>
          <div class="fav-grid" id="grid" aria-hidden="true"></div>
        </section>
      </main>
    </div>
  </div>

  <script src="js/shapes.js"></script>
  <script src="js/physics.js"></script>
  <script src="js/favoris.js"></script>
</body>
</html>
